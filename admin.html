<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malihati Durga Puja - Admin Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <style>
        :root {
            --primary: #990000;
            --primary-dark: #660000;
            --primary-light: #b30000;
            --accent: #FF9933;
            --accent-glow: rgba(255, 153, 51, 0.3);
            --bg-color: #F4F5F7;
            --card-bg: #FFFFFF;
            --text-main: #1A1D20;
            --text-muted: #6C757D;
            --border-color: #E2E8F0;
            --success: #10B981;
            --danger: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 35px -10px rgba(153, 0, 0, 0.15);
            --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Password Login Overlay with Animation */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.4s ease forwards;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-card h2 {
            font-family: 'Cinzel', serif;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        .login-card .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .login-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            font-weight: 500;
        }

        #adminAppContent {
            display: none;
            flex: 1;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Styling */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #FFFFFF;
            padding: 1.75rem 2.5rem;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 153, 51, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.85rem;
            letter-spacing: 0.5px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--accent), #ff8000);
            color: #111;
            font-weight: 700;
            padding: 0.7rem 1.4rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px var(--accent-glow);
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.1);
            color: #FFF;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
            backdrop-filter: blur(4px);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #FFF;
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: #FFF;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: #FFF;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
        }

        /* Main Dashboard */
        main {
            max-width: 1240px;
            width: 100%;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .dashboard-controls {
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1.25rem;
            border: 1px solid var(--border-color);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        select, input[type="text"], input[type="password"], input[type="url"] {
            padding: 0.75rem 1.1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            background: #FAFAFC;
            color: var(--text-main);
            width: 100%;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(153, 0, 0, 0.08);
        }

        input[type="file"] {
            padding: 0.5rem;
            border: 1.5px dashed var(--border-color);
            border-radius: 10px;
            background: #FAFAFC;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: var(--transition);
        }

        input[type="file"]:hover {
            border-color: var(--primary);
        }

        /* Card Grid */
        .pandals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .admin-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            position: relative;
            animation: cardEntrance 0.5s ease forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(153, 0, 0, 0.2);
        }

        .admin-card-img-wrap {
            position: relative;
            height: 200px;
            overflow: hidden;
            background-color: #EDF2F7;
        }

        .admin-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .admin-card:hover img {
            transform: scale(1.05);
        }

        .admin-card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            color: #FFF;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .admin-card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex-grow: 1;
        }

        .admin-card-year {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-card h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .admin-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .admin-card-footer {
            padding: 1rem 1.5rem;
            background: #FAFAFC;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 580px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #FFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #FFF;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }

        .empty-state h3 {
            font-family: 'Cinzel', serif;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <!-- PASSWORD LOGIN OVERLAY -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>🪔 Admin Portal</h2>
            <p>Enter your password to manage Malihati Puja archives</p>
            <form id="loginForm">
                <div class="form-group">
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                </div>
                <div id="loginError" class="login-error">Incorrect password. Please try again.</div>
                <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; margin-top: 1rem; padding: 0.8rem;">Access Dashboard</button>
            </form>
            <div style="margin-top: 1.5rem;">
                <a href="index.html" style="font-size: 0.9rem; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: var(--transition);">← Back to Public Website</a>
            </div>
        </div>
    </div>

    <!-- MAIN ADMIN APP CONTENT -->
    <div id="adminAppContent">
        <header>
            <h1>🪔 Malihati Durga Puja Admin</h1>
            <div class="header-actions">
                <a href="index.html" class="btn btn-outline">View Public Site</a>
                <button class="btn" id="openAddModalBtn">+ Add New Pandal</button>
            </div>
        </header>

        <main>
            <div class="dashboard-controls">
                <div class="filter-group">
                    <label for="adminYearSelect">Select Year:</label>
                    <select id="adminYearSelect" style="width: 180px;">
                        <option value="2025">🪔 2025</option>
                        <option value="2026" selected>🪔 2026</option>
                        <option value="2027">🪔 2027</option>
                        <option value="2028">🪔 2028</option>
                        <option value="2029">🪔 2029</option>
                    </select>
                </div>
                <div id="pandalStats" style="font-weight: 700; color: var(--text-muted); background: #EDF2F7; padding: 0.5rem 1rem; border-radius: 8px;">
                    Loading count...
                </div>
            </div>

            <!-- Pandals List Grid -->
            <div id="adminPandalContainer" class="pandals-grid">
                <!-- Dynamically populated via script -->
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="pandalFormModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Pandal</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="pandalForm">
                    <input type="hidden" id="pandalId">
                    <input type="hidden" id="existingImage">
                    
                    <div class="form-group">
                        <label for="formYear">Puja Year</label>
                        <select id="formYear" required>
                            <option value="2025">2025</option>
                            <option value="2026" selected>2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="formName">Pandal / Committee Name</label>
                        <input type="text" id="formName" placeholder="e.g. Malihati Sastitala Sarbojonin" required>
                    </div>

                    <div class="form-group">
                        <label for="formPlace">Location / Place</label>
                        <input type="text" id="formPlace" placeholder="e.g. Malihati Main Road" required>
                    </div>

                    <div class="form-group">
                        <label for="formImageFile">Pandal Image</label>
                        <input type="file" id="formImageFile" accept="image/*">
                        <small style="color: var(--text-muted); font-size: 0.8rem;">Choose a photo from your device.</small>
                    </div>

                    <div class="form-group">
                        <label for="formMap">Google Maps Link</label>
                        <input type="url" id="formMap" placeholder="https://maps.app.goo.gl/..." required>
                    </div>

                    <div class="form-group">
                        <label for="formDescription">Description</label>
                        <input type="text" id="formDescription" placeholder="Short description of the pandal celebration" required>
                    </div>

                    <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
                        <button type="button" class="btn btn-outline" id="cancelModalBtn" style="color: var(--text-main); border-color: var(--border-color); background: #EDF2F7;">Cancel</button>
                        <button type="submit" class="btn btn-success" id="savePandalBtn">Save Pandal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ADMIN MANAGEMENT SCRIPT -->
    <script>
        const ADMIN_PASSWORD_HASH = "malihati2026"; 
        const CACHE_KEY = "malihati_durga_puja_pandals_cache";

        const defaultPujaData = {
            2025: [
                { name: "Malihati Sastitala Sarbojonin Durga Puja", place: "Malihati Main Road", image: "images/2025/palpara.jpeg", description: "Malihati Sastitala Sarbojonin Durga Puja celebrates the spirit of the community.", map: "https://maps.app.goo.gl/dcH5TxwVo2i2kzb36" },
                { name: "Malihati Mondoptola Sarbojonin Durga Puja", place: "Malihati Main Road", image: "images/2025/mondoptala.jpeg", description: "A community Durga Puja celebrating togetherness, devotion and the creativity of Malihati.", map: "https://maps.app.goo.gl/ZVTgDQv5eg19ibfD6" }
            ],
            2026: [
                { name: "Malihati Sastitala Sarbojonin Durga Puja", place: "Malihati Main Road", image: "images/2026/palpara.jpeg", description: "Malihati Sastitala Sarbojonin Durga Puja celebrates the spirit of the community.", map: "https://maps.app.goo.gl/dcH5TxwVo2i2kzb36" }
            ],
            2027: [],
            2028: [],
            2029: []
        };

        let adminPandals = [];
        let currentSelectedYear = "2026";

        const loginOverlay = document.getElementById("loginOverlay");
        const loginForm = document.getElementById("loginForm");
        const adminPasswordInput = document.getElementById("adminPassword");
        const loginError = document.getElementById("loginError");
        const adminAppContent = document.getElementById("adminAppContent");

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (adminPasswordInput.value === ADMIN_PASSWORD_HASH) {
                loginOverlay.style.display = "none";
                adminAppContent.style.display = "block";
                loadData();
                renderAdminPandals();
            } else {
                loginError.style.display = "block";
                adminPasswordInput.style.borderColor = "var(--danger)";
            }
        });

        const adminYearSelect = document.getElementById("adminYearSelect");
        const adminPandalContainer = document.getElementById("adminPandalContainer");
        const pandalStats = document.getElementById("pandalStats");
        const pandalFormModal = document.getElementById("pandalFormModal");
        const openAddModalBtn = document.getElementById("openAddModalBtn");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const cancelModalBtn = document.getElementById("cancelModalBtn");
        const pandalForm = document.getElementById("pandalForm");
        const modalTitle = document.getElementById("modalTitle");

        const inputId = document.getElementById("pandalId");
        const inputYear = document.getElementById("formYear");
        const inputName = document.getElementById("formName");
        const inputPlace = document.getElementById("formPlace");
        const inputImageFile = document.getElementById("formImageFile");
        const inputExistingImage = document.getElementById("existingImage");
        const inputMap = document.getElementById("formMap");
        const inputDescription = document.getElementById("formDescription");

        function loadData() {
            try {
                const saved = localStorage.getItem(CACHE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        adminPandals = parsed;
                        return;
                    }
                }
            } catch (e) {
                console.error("Error loading local storage:", e);
            }

            adminPandals = [];
            Object.keys(defaultPujaData).forEach(year => {
                defaultPujaData[year].forEach((pandal, index) => {
                    adminPandals.push({
                        ...pandal,
                        id: `${year}-${index}`,
                        year: year
                    });
                });
            });
            saveData();
        }

        function saveData() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(adminPandals));
            } catch (e) {
                console.error("Error saving to local storage:", e);
            }
        }

        function renderAdminPandals() {
            currentSelectedYear = adminYearSelect.value;
            adminPandalContainer.innerHTML = "";

            const filtered = adminPandals.filter(p => String(p.year) === String(currentSelectedYear));
            pandalStats.textContent = `${filtered.length} ${filtered.length === 1 ? 'Pandal' : 'Pandals'} in ${currentSelectedYear}`;

            if (filtered.length === 0) {
                adminPandalContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>No Pandals Found</h3>
                        <p>No puja pandals have been added for ${currentSelectedYear} yet.</p>
                    </div>
                `;
                return;
            }

            const fragment = document.createDocumentFragment();
            filtered.forEach((pandal, index) => {
                const card = document.createElement("div");
                card.className = "admin-card";
                card.style.animationDelay = `${index * 50}ms`;
                card.innerHTML = `
                    <div class="admin-card-img-wrap">
                        <img src="${pandal.image}" alt="${pandal.name}" onerror="this.src=''">
                        <span class="admin-card-badge">${pandal.year}</span>
                    </div>
                    <div class="admin-card-body">
                        <span class="admin-card-year">Durga Puja Archive</span>
                        <h3>${pandal.name}</h3>
                        <p>📍 ${pandal.place}</p>
                        <p style="font-size:0.85rem; color:#666; margin-top:0.25rem;">${pandal.description}</p>
                    </div>
                    <div class="admin-card-footer">
                        <button class="btn btn-outline" style="color:var(--text-main); border-color:var(--border-color); background:#FAFAFC; padding:0.4rem 0.9rem; font-size:0.85rem;" onclick="editPandal('${pandal.id}')">Edit</button>
                        <button class="btn btn-danger" style="padding:0.4rem 0.9rem; font-size:0.85rem;" onclick="deletePandal('${pandal.id}')">Delete</button>
                    </div>
                `;
                fragment.appendChild(card);
            });
            adminPandalContainer.appendChild(fragment);
        }

        adminYearSelect.addEventListener("change", renderAdminPandals);

        function openModal(isEdit = false) {
            pandalFormModal.classList.add("active");
            if (!isEdit) {
                modalTitle.textContent = "Add New Pandal";
                pandalForm.reset();
                inputId.value = "";
                inputYear.value = currentSelectedYear;
                inputExistingImage.value = "";
            }
        }

        function closeModal() {
            pandalFormModal.classList.remove("active");
        }

        openAddModalBtn.addEventListener("click", () => openModal(false));
        closeModalBtn.addEventListener("click", closeModal);
        cancelModalBtn.addEventListener("click", closeModal);
        
        pandalFormModal.addEventListener("click", (e) => {
            if (e.target === pandalFormModal) closeModal();
        });

        window.editPandal = function(id) {
            const pandal = adminPandals.find(p => p.id === id);
            if (!pandal) return;

            modalTitle.textContent = "Edit Pandal";
            inputId.value = pandal.id;
            inputYear.value = pandal.year;
            inputName.value = pandal.name;
            inputPlace.value = pandal.place;
            inputExistingImage.value = pandal.image;
            inputMap.value = pandal.map;
            inputDescription.value = pandal.description;
            inputImageFile.value = "";

            openModal(true);
        };

        pandalForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const id = inputId.value;
            const processAndSave = (imageUrl) => {
                const pandalData = {
                    id: id || `pandal-${Date.now()}`,
                    year: inputYear.value,
                    name: inputName.value.trim(),
                    place: inputPlace.value.trim(),
                    image: imageUrl || inputExistingImage.value || "images/2026/pandal4.jpg",
                    map: inputMap.value.trim(),
                    description: inputDescription.value.trim()
                };

                if (id) {
                    const index = adminPandals.findIndex(p => p.id === id);
                    if (index !== -1) {
                        adminPandals[index] = pandalData;
                    }
                } else {
                    adminPandals.push(pandalData);
                }

                saveData();
                renderAdminPandals();
                closeModal();
            };

            if (inputImageFile.files && inputImageFile.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    processAndSave(event.target.result);
                };
                reader.readAsDataURL(inputImageFile.files[0]);
            } else {
                processAndSave(null);
            }
        });

        window.deletePandal = function(id) {
            if (confirm("Are you sure you want to delete this pandal from the archive?")) {
                adminPandals = adminPandals.filter(p => p.id !== id);
                saveData();
                renderAdminPandals();
            }
        };
    </script>
</body>
</html>
